<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>How Smart Are Animals? Day 3 Teacher-Led</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
/* Layout: one projected slide at a time inside a navy vault frame; bottom control bar; optional teacher-notes drawer and pen layer. Single committed look. */
:root{
  --vault:#13203f; --vault-2:#1d2d55; --gold:#f2b705; --gold-deep:#c98f00;
  --card:#fffaf0; --ink:#1b2240; --muted:#5b6283; --line:#e6dcc6;
  --good:#1f9d6b; --good-bg:#e3f6ec; --try:#d9822b; --try-bg:#fff0de; --miss:#c2416b; --miss-bg:#fde7ee;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--vault);color:var(--ink);font-family:var(--body);font-size:clamp(18px,1.9vw,26px);line-height:1.45;overflow:hidden;
  background-image:radial-gradient(circle at 12% 8%,rgba(242,183,5,.10),transparent 40%),radial-gradient(circle at 88% 92%,rgba(90,140,255,.12),transparent 45%)}
.shell{height:100%;display:flex;flex-direction:column;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:8px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo-spot{width:44px;height:44px;border-radius:10px;border:2px dashed rgba(242,183,5,.6);flex:none}
.brand small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.brand b{font-family:var(--display);font-weight:400;font-size:clamp(16px,1.8vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sec{font-size:14px;color:#dfe6ff;text-align:right}
.sec b{color:var(--gold)}
.stage{flex:1;min-height:0;position:relative}
.slide{position:absolute;inset:0;background:var(--card);border-radius:24px;box-shadow:0 10px 0 rgba(0,0,0,.2);padding:clamp(18px,3vw,44px);overflow:auto;border-top:14px solid var(--c)}
.slide.enter{animation:in .35s ease-out}
@keyframes in{from{opacity:.4;transform:translateX(24px)}to{opacity:1;transform:none}}
#pen{position:absolute;inset:0;border-radius:24px;z-index:5;pointer-events:none;touch-action:none}
body.drawing #pen{pointer-events:auto;cursor:crosshair}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
.slide h2{font-size:clamp(30px,4vw,56px);color:var(--ink);margin-bottom:.4em}
.slide p{margin:0 0 .6em;max-width:60ch}
.slide ul{margin:0 0 .6em;padding-left:1.1em}
.slide li{margin-bottom:.35em}
.term{font-weight:700;color:var(--c)}
.tag{display:inline-block;font-size:clamp(12px,1.1vw,16px);letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:5px 14px;border-radius:999px;background:var(--c);color:#fff;margin-bottom:.7em}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:.4em 0 .8em}
.chip{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:.85em}
.chip b{color:var(--c)}
.tip{background:#fff;border-left:8px solid var(--gold);border-radius:14px;padding:12px 16px;margin:.6em 0}
.passage{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 20px;margin:0 0 .8em;font-size:.9em}
.passage .pt{font-family:var(--display);font-size:1.15em;margin-bottom:6px;color:var(--c)}
.poem{white-space:pre-line;font-style:italic}
.split{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:900px){.split.two{grid-template-columns:1.1fr 1fr;align-items:start}}
.split>*{min-width:0}
.q{font-weight:700;font-size:1.1em;margin:0 0 .6em}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:16px;padding:12px 16px;cursor:pointer;display:flex;gap:14px;align-items:flex-start}
.opt .ltr{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85em}
.opt.right,.tapline.right{border-color:var(--good)!important;background:var(--good-bg)!important}
.opt.wrong,.tapline.wrong{border-color:var(--miss)!important;background:var(--miss-bg)!important;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tapline{display:block;width:100%;font:inherit;text-align:left;border:2px dashed transparent;background:transparent;color:var(--ink);border-radius:10px;padding:5px 8px;cursor:pointer;margin:2px 0}
.tapline:hover{background:#fff6d6;border-color:var(--gold)}
.reveal-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-weight:700;font-size:clamp(15px,1.4vw,20px);border:none;border-radius:14px;padding:10px 18px;cursor:pointer;background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}
.btn.dark{background:var(--vault-2);color:#fff;box-shadow:0 4px 0 #0b1430}
.btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.btn.on{background:#fff;color:var(--ink);box-shadow:0 4px 0 #b9c0d6}
.btn:focus-visible,.opt:focus-visible,.tapline:focus-visible{outline:4px solid #5a8cff;outline-offset:2px}
.answer{margin-top:14px;border-radius:16px;padding:14px 18px;background:var(--good-bg);border:2px solid var(--good)}
.answer b.big{display:block;font-family:var(--display);font-weight:400;font-size:1.2em;margin-bottom:4px}
.hintbox{margin-top:14px;border-radius:16px;padding:12px 18px;background:var(--try-bg);border:2px solid var(--try)}
.respond{display:inline-block;font-size:.75em;font-weight:700;color:var(--muted);border:2px solid var(--line);border-radius:999px;padding:3px 12px;margin-bottom:.6em}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:.3em 0 .8em}
.starters span{border:2px solid var(--c);border-radius:999px;padding:4px 12px;background:#fff;font-size:.85em}
.stdbox{background:#eef3ff;border:2px solid #b9c8f0;border-radius:14px;padding:10px 14px;margin:.4em 0 .8em;font-size:.72em;line-height:1.4}
.stdbox .lbl{font-size:.8em;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block}
.stdbox p{margin:4px 0 0;max-width:none}
.stdbox b{color:#1d3d8f}
.cover{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.cover h1{font-size:clamp(40px,6.5vw,92px);color:var(--ink)}
.cover .day{font-family:var(--display);color:var(--c);font-size:clamp(26px,3.5vw,48px)}
.cando{display:grid;gap:8px;margin-top:.6em}
.cando div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.cando div::before{content:"🔑 ";}
.divider{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.divider .num{font-size:clamp(14px,1.4vw,20px);letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.divider h2{font-size:clamp(40px,6vw,84px);color:var(--c)}
.bigkey{width:clamp(90px,10vw,150px);height:auto;display:block;margin-bottom:10px}
.controls{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#fff}
.controls .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count{font-variant-numeric:tabular-nums;font-weight:700;min-width:5.5em;text-align:center}
.bar{height:6px;background:var(--vault-2);border-radius:99px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.pens{display:none;gap:6px}
body.drawing .pens{display:flex}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;cursor:pointer}
.notes{position:absolute;right:12px;bottom:12px;width:min(460px,calc(100% - 24px));max-height:60%;overflow:auto;background:#fff6d6;border:3px solid var(--gold);border-radius:18px;padding:14px 16px;z-index:8;font-size:16px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.notes h4{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:20px}
.notes p{margin:0 0 8px}
.menu{position:absolute;left:12px;bottom:12px;width:min(380px,calc(100% - 24px));max-height:70%;overflow:auto;background:#fff;border-radius:18px;padding:12px;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:16px}
.menu button{display:block;width:100%;text-align:left;font:inherit;border:none;background:transparent;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink)}
.menu button:hover{background:#fff6d6}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-200%);background:var(--gold);color:var(--ink);font-family:var(--display);font-size:clamp(20px,2.4vw,32px);padding:10px 24px;border-radius:999px;box-shadow:0 6px 0 var(--gold-deep);transition:transform .3s,opacity .3s;opacity:0;z-index:20;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.logo-img{width:56px;height:56px;flex:none;border-radius:14px;background:#fff;object-fit:contain;box-shadow:0 3px 0 rgba(0,0,0,.25)}
</style>

const STATIONS = [
{ id:"central", std:["ELA.6.R.2.2"], g:"all", color:"#3f9b3a", title:"Central Idea", blurb:"Find the controlling idea",
  learn:[
   {h:"The controlling idea", html:`<p>The <span class="term">central idea</span> is the most important point the author makes about the topic. In a science article, it's often called the <span class="term">controlling idea</span> because it <b>controls</b> everything else. Every paragraph supports it.</p>
   <ul><li>Look in the <b>introduction</b>. Science articles often state the controlling idea early.</li><li>Check the <b>conclusion</b>. It often restates it in a new way.</li><li>Test it: does it fit the <b>whole</b> article?</li></ul>`},
   {h:"Central idea vs. details", html:`<ul><li><b>Central idea</b> = the umbrella</li><li><b>Supporting evidence</b> = the raindrops under the umbrella</li></ul>

   {t:"mc",d:2,q:"How does the last sentence connect to the controlling idea?",opts:["It introduces a brand-new topic.","It restates the idea that animals are smart in different ways.","It argues that animals are not smart.","It lists the animals again."],a:1,hint:"Compare the first and last sentences.",why:"The conclusion restates the controlling idea in a new way: each animal is smart in its own way."},

{ id:"evidence", std:["ELA.6.R.2.2", "ELA.K12.EE.1.1"], g:"all", color:"#2a9d8f", title:"Four Types of Evidence", blurb:"Facts, statistics, examples & experts",

   {h:"How authors support the controlling idea", html:`<ul>

   <li><span class="term">Examples</span>: specific cases that show the idea. Often starts with <i>for example</i> or <i>such as</i>.</li>
   <li><span class="term">Expert quotations or opinions</span>: what a scientist or expert says or reports about the topic.</li></ul>
   <div class="tip"><b>Quick sort:</b> a number? → statistic. A scientist's words or findings? → expert. "For example…" → example. Can be proven? → fact.</div>`},
   {h:"Why use different types?", html:`<p>Using different types of evidence makes an article <b>stronger</b> and more convincing.</p>

  ],

  qs:[

function qNotes(q){

  else if(q.t==="tap") ans="Sentence "+(q.a+1);
  else if(q.t==="order") ans=q.items.join(" → ");
  else ans="See the model answer (reveal on the slide).";
  return `<p><b>${q.d===1?"DOK 1 (recall)":"DOK 2 (skill/concept)"}</b></p><p><b>Answer:</b> ${ans}</p>${q.hint?`<p><b>If students are stuck, prompt:</b> ${q.hint}</p>`:""}${q.why?`<p><b>Why:</b> ${q.why}</p>`:""}`;
}

  } else if(sl.kind==="end"){
    h=`<div class="cover">${KEY_SVG("#c98f00")}<div class="day">${PAGE.day} complete!</div><h1>You unlocked every key!</h1>
    <h3 style="margin-top:.6em;font-size:1.2em">Look back: Today, I can…</h3><div class="cando">${PAGE.cando.map(c=>`<div>${c}</div>`).join("")}</div>
    ${PAGE.checklist.length?`<div class="tip"><b>Due today:</b> ${PAGE.checklist.join(" · ")}</div>`:""}
    ${PAGE.next?`<div class="tip"><b>Next:</b> ${PAGE.next}</div>`:""}</div>`;
  }
  slideEl.innerHTML=h;
  if(anim){ slideEl.classList.remove("enter"); void slideEl.offsetWidth; slideEl.classList.add("enter"); }
  slideEl.scrollTop=0;
  document.getElementById("count").textContent=`${S.i+1} / ${SLIDES.length}`;
  document.getElementById("barFill").style.width=((S.i)/(SLIDES.length-1)*100)+"%";
  document.getElementById("prev").disabled=S.i===0;
  document.getElementById("next").textContent=S.i===SLIDES.length-1?"Done 🎉":"Next ▶";
  const n=document.getElementById("notes"); n.innerHTML=`<h4>Teacher notes</h4>${/^</.test(sl.notes||"")?sl.notes:`<p>${sl.notes||""}</p>`}`;
  wire(sl);
  restorePen();
  if(sl.kind==="key" || sl.kind==="end") setTimeout(bigConfetti,200);
  save();
}

function markRevealed(sl){
  const q=sl.q;
  S.rev[S.i]=true; save();
  const rb=document.getElementById("revealBtn"); if(rb) rb.hidden=true;
  if(sl.kind==="example"){ document.getElementById("ans").hidden=false; popConfetti(); return; }
  if(q.t==="mc") slideEl.querySelectorAll(".opt").forEach(b=>{ if(+b.dataset.k===q.a) b.classList.add("right"); });
  if(q.t==="multi") slideEl.querySelectorAll(".opt").forEach(b=>{ if(q.a.includes(+b.dataset.k)) b.classList.add("right"); });
  if(q.t==="tap") slideEl.querySelectorAll(".tapline").forEach(b=>{ if(+b.dataset.k===q.a) b.classList.add("right"); });
  if(q.t==="order"){ const box=slideEl.querySelector(".opts"); box.innerHTML=q.items.map((t,k)=>`<div class="opt right"><span class="ltr">${k+1}</span><span>${t}</span></div>`).join(""); }
  const fb=document.getElementById("fb");
  if(q.t==="write") fb.innerHTML=`<div class="answer"><b class="big">Model answer</b>${q.model}<p style="margin-top:8px"><i>Check: Does your answer have these key ideas?</i></p></div>`;
  else fb.innerHTML=`<div class="answer"><b class="big">${pick(PRAISE)} ✨</b>${q.why}</div>`;
  popConfetti();
}
function wire(sl){
  const rb=document.getElementById("revealBtn");
  if(sl.kind==="example"){ if(rb) rb.onclick=()=>markRevealed(sl); return; }
  if(sl.kind!=="q") return;
  const q=sl.q;
  if(S.rev[S.i]){ markRevealedQuiet(sl); }
  if(rb) rb.onclick=()=>markRevealed(sl);
  // teacher can tap a class answer to check it
  if(q.t==="mc"||q.t==="tap"){
    slideEl.querySelectorAll(q.t==="mc"?".opt":".tapline").forEach(b=>b.onclick=()=>{
      if(S.rev[S.i]) return;
      if(+b.dataset.k===q.a){ markRevealed(sl); toast(pick(PRAISE)); }
      else { b.classList.add("wrong"); document.getElementById("fb").innerHTML=`<div class="hintbox"><b>Not quite. Try again!</b> 💡 ${q.hint}</div>`; }
    });
  }
  if(q.t==="multi"){
    slideEl.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(S.rev[S.i]) return;
      const k=+b.dataset.k;
      if(q.a.includes(k)){ b.classList.add("right"); const all=q.a.every(x=>slideEl.querySelector(`.opt[data-k="${x}"]`).classList.contains("right")); if(all){ markRevealed(sl); toast("Found them all!"); } else toast("Yes! Find another."); }
      else { b.classList.add("wrong"); document.getElementById("fb").innerHTML=`<div class="hintbox"><b>Not that one.</b> 💡 ${q.hint}</div>`; }
    });
  }
}
function markRevealedQuiet(sl){ const c=window.confetti; window.confetti=null; markRevealed(sl); window.confetti=c; }

/* ======== NAV ======== */
function go(i){ if(i<0||i>=SLIDES.length) return; savePen(); S.i=i; render(); }
document.getElementById("next").onclick=()=>{ if(S.i===SLIDES.length-1){ bigConfetti(); toast("Lesson complete! 🎉"); } else go(S.i+1); };
document.getElementById("prev").onclick=()=>go(S.i-1);
document.addEventListener("keydown",e=>{ if(e.target.closest("input,textarea")) return; if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();go(S.i+1);} if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(S.i-1);} if(e.key==="n") toggleNotes(); });
function toggleNotes(){ const n=document.getElementById("notes"); n.hidden=!n.hidden; document.getElementById("notesBtn").classList.toggle("on",!n.hidden); }
document.getElementById("notesBtn").onclick=toggleNotes;
const menu=document.getElementById("menu");
document.getElementById("menuBtn").onclick=()=>{
  menu.innerHTML=SLIDES.map((sl,i)=>({sl,i})).filter(o=>["cover","divider","end"].includes(o.sl.kind)).map(o=>`<button data-i="${o.i}">${o.sl.kind==="divider"?"Part "+(o.sl.si+1)+": "+o.sl.s.title:o.sl.kind==="cover"?"Welcome & goals":"Wrap-up"}</button>`).join("");
  menu.hidden=!menu.hidden;
  menu.querySelectorAll("button").forEach(b=>b.onclick=()=>{ menu.hidden=true; go(+b.dataset.i); });
};
(function(){ const rb=document.getElementById("resetBtn"); let armed=false, h=null;
  rb.onclick=()=>{ if(!armed){ armed=true; rb.textContent="Tap again to reset"; clearTimeout(h); h=setTimeout(()=>{ armed=false; rb.textContent="↺ Reset lesson"; },4000); return; }
    armed=false; rb.textContent="↺ Reset lesson"; S={i:0,rev:{}}; for(const k in ink) delete ink[k]; save(); render(); toast("Lesson reset! Ready for the next class."); }; })();
document.getElementById("fsBtn").onclick=()=>{ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }catch(e){} };

/* ======== PEN (Apple Pencil / finger) ======== */
const cv=document.getElementById("pen"), ctx=cv.getContext("2d"); let penColor="#e0245e", drawing=false, last=null; const ink={};
function sizeCanvas(){ const r=cv.getBoundingClientRect(); const dpr=window.devicePixelRatio||1; const keep=cv.width?cv.toDataURL():null; cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap="round"; ctx.lineJoin="round"; if(keep){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=keep; } }
window.addEventListener("resize",sizeCanvas);
function savePen(){ try{ ink[S.i]=cv.toDataURL(); }catch(e){} }
function stopDrawingSave(){}
function restorePen(){ const r=cv.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); if(ink[S.i]){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=ink[S.i]; } }
cv.addEventListener("pointerdown",e=>{ drawing=true; last=pt(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove",e=>{ if(!drawing) return; const p=pt(e); ctx.strokeStyle=penColor; ctx.lineWidth=e.pressure&&e.pointerType==="pen"?3+e.pressure*6:5; ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>{ drawing=false; savePen(); }));
function pt(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
document.getElementById("penBtn").onclick=()=>{ document.body.classList.toggle("drawing"); document.getElementById("penBtn").classList.toggle("on",document.body.classList.contains("drawing")); };
document.querySelectorAll(".sw").forEach(s=>s.onclick=()=>{ penColor=s.dataset.c; });
document.getElementById("clearPen").onclick=()=>{ const r=cv.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); delete ink[S.i]; };

/* ======== CELEBRATION ======== */
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }
function popConfetti(){ if(window.confetti) confetti({particleCount:90,spread:80,origin:{y:.7},colors:["#f2b705","#2a9d8f","#e76f51","#7b4fd6","#2c7be5"]}); }
function bigConfetti(){ if(!window.confetti) return; const end=Date.now()+1800; (function f(){ confetti({particleCount:6,angle:60,spread:60,origin:{x:0}}); confetti({particleCount:6,angle:120,spread:60,origin:{x:1}}); if(Date.now()<end) requestAnimationFrame(f); })(); confetti({particleCount:150,spread:110,origin:{y:.55}}); }

if(S.i>=SLIDES.length) S.i=0;
sizeCanvas(); render(false);
</script>

</body></html>
